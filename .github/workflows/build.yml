      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: tsx_tuner
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          { echo '### Build log (60 dong cuoi)'; echo '```'; tail -n 60 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: TSX-Tuner-apk
          path: tsx_tuner/app/build/outputs/apk/debug/app-debug.apk
          
